workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "testAro"'
      when: always
    - when: never

stages:
  - deploy

variables:
  SOURCE_PROJET: "/home/aroniaina/Documents/IA-VICITELECOM/Ari_IA_AgentFrontend"

deploy_projet:
  stage: deploy
  tags:
    - linux
    - production
    - serveur

  script:
    - echo "🚀 Déploiement..."
    - cd "$SOURCE_PROJET"
    - git fetch origin
    - git reset --hard origin/production
    - git clean -fd
    - git pull origin production
    - pm2 restart 0
    - pm2 list

  after_script:
    - echo "✅ Déploiement terminé"