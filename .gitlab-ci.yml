workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "reunification"'
      when: always
    - when: never

stages:
  - deploy

variables:
  SOURCE_PROJET: "/mnt/data/spyteam/spyteam-back"

deploy_projet:
  stage: deploy
  tags:
    - linux
    - production
    - serveur

  script:
    - echo "🚀 Encore un test..."
    - cd "$SOURCE_PROJET"
    - git remote -v
    - git branch

  after_script:
    - echo "✅ Déploiement terminé"